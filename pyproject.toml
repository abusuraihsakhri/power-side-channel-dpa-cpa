[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "power-side-channel-dpa-cpa"
version = "2.0.0"
description = "Correlation Power Analysis (CPA) & DPA Side-Channel Attack Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
power-side-channel-dpa-cpa = "cpa_side_channel.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/power-side-channel-dpa-cpa"
Repository = "https://github.com/abusuraihsakhri/power-side-channel-dpa-cpa.git"
