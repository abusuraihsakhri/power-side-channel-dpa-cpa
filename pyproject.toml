[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "power-side-channel-dpa-cpa"
version = "2.0.1"
description = "Synthetic side-channel CPA benchmarks and audit tooling"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
power-side-channel-dpa-cpa = "cpa_side_channel.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/power-side-channel-dpa-cpa"
Repository = "https://github.com/abusuraihsakhri/power-side-channel-dpa-cpa"

[tool.setuptools.packages.find]
include = ["agents*", "cpa_side_channel*"]
